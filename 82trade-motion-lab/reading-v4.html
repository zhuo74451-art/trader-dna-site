<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>82TRADE — Reading V4 Study</title>
<style>
/* book mechanics: book-cover-3d / MIT / Sebastien Castiel */
:root{
  --bg:#111214;--ink:#f5f5f7;--muted:#9c9ca3;--line:rgba(255,255,255,.11);
  --blue:#6d9cff;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Times New Roman","Noto Serif TC",Georgia,serif;--ease:cubic-bezier(.2,.75,.22,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow:hidden}
.shell{min-height:100svh;display:grid;grid-template-rows:70px 1fr 88px;padding:0 3.1vw}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-size:14px;font-weight:850;letter-spacing:-.04em}
.topMeta{color:#777981;font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.hero{min-height:0;display:grid;grid-template-columns:minmax(420px,.88fr) minmax(0,1.12fr);position:relative}
.hero:before{
  content:"";position:absolute;left:-3.1vw;right:-3.1vw;bottom:0;height:27%;
  background:linear-gradient(180deg,rgba(255,255,255,.01),rgba(255,255,255,.035));
  clip-path:polygon(7% 28%,93% 28%,100% 100%,0 100%)
}
.bookPane{position:relative;display:grid;place-items:center;min-width:0}
.bookPane:before{
  content:"";position:absolute;width:64%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(109,156,255,.12),rgba(255,255,255,.035) 34%,transparent 70%);
  filter:blur(12px);transform:translate(-6%,-2%)
}
.bookStage{position:relative;z-index:2;width:430px;height:590px;display:grid;place-items:center;perspective:1000px}
.bookShadow{position:absolute;width:390px;height:74px;bottom:6%;background:radial-gradient(ellipse,rgba(0,0,0,.7),rgba(0,0,0,.2) 50%,transparent 72%);filter:blur(10px);transform:rotate(-4deg)}
.book{width:315px;height:455px;position:relative;transform-style:preserve-3d;transform:rotateY(-22deg) rotateX(1deg);filter:drop-shadow(-20px 34px 42px rgba(0,0,0,.44));animation:bookIn .9s var(--ease) both}
.front{position:absolute;inset:0;transform:translateZ(25px);overflow:hidden;border-radius:1px 4px 4px 1px;background:#17210d;box-shadow:5px 7px 28px rgba(0,0,0,.44)}
.front img{display:block;width:100%;height:100%;object-fit:cover}
.front:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 15%,transparent 84%,rgba(255,255,255,.07))}
.book:before{
  content:"";position:absolute;left:0;top:3px;width:49px;height:449px;transform:translateX(290px) rotateY(90deg);
  background:repeating-linear-gradient(90deg,#f4efe4 0,#f4efe4 3px,#d4cdbf 4px,#faf7ef 6px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)
}
.book:after{content:"";position:absolute;inset:0;transform:translateZ(-25px);background:#12140f;border-radius:0 4px 4px 0;box-shadow:-18px 0 52px rgba(0,0,0,.5)}
.copy{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:5vh 5vw 7vh 3vw;min-width:0;animation:copyIn .62s ease both}
.eyebrow{display:flex;gap:14px;align-items:center;color:var(--blue);font-size:9px;font-weight:760;letter-spacing:.16em;text-transform:uppercase}
.eyebrow:before{content:"";width:30px;height:1px;background:var(--blue)}
h1{margin:28px 0 20px;font-family:var(--serif);font-size:clamp(58px,5.2vw,86px);line-height:.95;font-weight:400;letter-spacing:-.045em}
.lede{max-width:650px;margin:0;color:#b5b5ba;font-family:var(--serif);font-size:17px;line-height:1.68}
.reason{max-width:650px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:92px 1fr;gap:24px}
.reason span{color:#666870;font-size:8px;letter-spacing:.13em;text-transform:uppercase}
.reason p{margin:0;color:#d3d3d7;font-size:13px;line-height:1.6}
.shelf{max-width:650px;margin-top:38px;border-top:1px solid var(--line)}
.row{min-height:48px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);color:#6f7179}
.row small{font-size:8px;letter-spacing:.12em}
.row b{font-size:14px;font-weight:520}
.row em{font-style:normal;color:var(--blue);font-size:8px;letter-spacing:.12em}
.row[data-selected="true"]{color:#fff}
.foot{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto;align-items:center;border-top:1px solid var(--line)}
.footMeta{color:#73757d;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.arrows{display:flex;gap:8px}
.arrows button{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#70727a;font-size:17px}
@keyframes bookIn{from{opacity:0;transform:rotateY(-52deg) translate3d(-40px,24px,-70px) scale(.94)}to{opacity:1;transform:rotateY(-22deg) rotateX(1deg) scale(1)}}
@keyframes copyIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:900px){
 body{overflow:auto}.shell{min-height:auto;grid-template-rows:60px auto auto;padding:0 18px}
 .hero{grid-template-columns:1fr}.bookPane{min-height:430px}.bookStage{width:310px;height:420px;transform:scale(.8)}
 .copy{padding:0 0 34px;justify-content:flex-start}h1{font-size:clamp(48px,13vw,66px);margin:20px 0 14px}
 .lede{font-size:15px}.reason{grid-template-columns:76px 1fr;margin-top:24px;gap:16px}.shelf{margin-top:28px}
 .foot{min-height:72px}
}
@media(prefers-reduced-motion:reduce){.book,.copy{animation:none}}
</style>
</head>
