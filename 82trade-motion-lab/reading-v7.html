<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>82TRADE — Reading Study 07</title>
<style>
:root{
  --bg:#111214;
  --bg-soft:#161719;
  --ink:#f2f1ed;
  --muted:#a5a5aa;
  --dim:#666870;
  --line:rgba(255,255,255,.105);
  --blue:#75a3ff;
  --sans:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU","Times New Roman",serif;
  --ease:cubic-bezier(.2,.72,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow:hidden}
.page{
  height:100svh;
  display:grid;
  grid-template-rows:68px 1fr 74px;
  padding:0 3.25vw;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(255,255,255,.012),transparent 18%),
    #111214;
}
.page:before{
  content:"";
  position:absolute;
  left:-8vw;right:-8vw;bottom:74px;height:20%;
  background:
    linear-gradient(180deg,rgba(255,255,255,.004),rgba(255,255,255,.018));
  clip-path:polygon(8% 20%,92% 20%,100% 100%,0 100%);
  pointer-events:none;
}
.header{
  position:relative;z-index:8;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line)
}
.logo{font-size:15px;font-weight:850;letter-spacing:-.04em}
.headerMeta{
  display:flex;gap:24px;
  color:#72747b;font-size:9px;letter-spacing:.15em;text-transform:uppercase
}
.scene{
  position:relative;z-index:2;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(430px,.92fr) minmax(0,1.08fr)
}
.visual{
  position:relative;
  min-width:0;
  display:grid;
  place-items:center;
  overflow:visible;
}
.visual:before{
  content:"";
  position:absolute;
  width:58%;
  height:78%;
  left:10%;
  top:9%;
  background:linear-gradient(105deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 42%,transparent 76%);
  filter:blur(18px);
  transform:skewX(-7deg);
}
.visual:after{
  content:"";
  position:absolute;
  left:8%;right:7%;bottom:12%;
  height:74px;
  background:radial-gradient(ellipse,rgba(0,0,0,.66),rgba(0,0,0,.15) 54%,transparent 74%);
  filter:blur(10px);
}
.bookObject{
  position:relative;z-index:3;
  width:min(24vw,350px);
  transform:translate3d(-2%,8px,0);
  filter:drop-shadow(-18px 34px 40px rgba(0,0,0,.48));
  animation:bookIn .82s var(--ease) both;
}
.bookObject img{display:block;width:100%;height:auto}
.bookObject:after{
  content:"";
  position:absolute;
  left:22%;right:-4%;bottom:-5%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(117,163,255,.18),transparent);
  opacity:.7;
}
.copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:3vh 5vw 7vh 3.6vw;
  animation:copyIn .58s ease both;
}
.kicker{
  display:flex;align-items:center;gap:14px;
  color:var(--blue);font-size:9px;font-weight:760;letter-spacing:.17em;text-transform:uppercase
}
.kicker:before{content:"";width:30px;height:1px;background:var(--blue)}
h1{
  margin:26px 0 18px;
  max-width:760px;
  font-family:var(--serif);
  font-size:clamp(58px,4.9vw,82px);
  line-height:.98;
  font-weight:500;
  letter-spacing:-.048em;
}
.lede{
  max-width:670px;
  margin:0;
  color:#b4b4b8;
  font-family:var(--serif);
  font-size:17px;
  line-height:1.72;
}
.why{
  max-width:670px;
  display:grid;
  grid-template-columns:90px minmax(0,1fr);
  gap:22px;
  margin-top:22px;
  padding-top:17px;
  border-top:1px solid var(--line);
}
.whyLabel{
  color:#63656d;
  font-size:8px;
  letter-spacing:.14em;
  text-transform:uppercase
}
.whyText{
  margin:0;
  color:#d0d0d3;
  font-size:12.5px;
  line-height:1.58
}
.shelf{
  max-width:670px;
  margin-top:32px;
  border-top:1px solid var(--line)
}
.row{
  min-height:46px;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  align-items:center;
  border-bottom:1px solid var(--line);
  color:#696b72;
}
.row small{font-size:8px;letter-spacing:.13em}
.row b{font-size:14px;font-weight:530}
.row em{
  color:var(--blue);
  font-size:8px;
  font-style:normal;
  letter-spacing:.13em
}
.row[data-selected="true"]{color:#fff}
.footer{
  position:relative;z-index:8;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  border-top:1px solid var(--line)
}
.footerText{
  color:#62646b;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase
}
.footerText:last-child{text-align:right}
.pager{display:flex;align-items:center;gap:19px}
.pager span{color:#56585f;font-size:9px}
.pager .active{color:#fff}
.pager .active:after{
  content:"";
  display:block;
  width:24px;height:1px;
  margin:8px auto 0;
  background:var(--blue)
}
@keyframes bookIn{
  from{opacity:0;transform:translate3d(-30px,38px,0) scale(.96)}
  to{opacity:1;transform:translate3d(-2%,8px,0) scale(1)}
}
@keyframes copyIn{
  from{opacity:0;transform:translateY(17px)}
  to{opacity:1;transform:none}
}
@media(max-width:900px){
  body{overflow:auto}
  .page{
    min-height:100svh;height:auto;
    grid-template-rows:60px auto 66px;
    padding:0 18px
  }
  .page:before{bottom:0;height:39%}
  .headerMeta span:first-child{display:none}
  .scene{grid-template-columns:1fr}
  .visual{min-height:420px}
  .visual:before{width:78%;height:72%;left:4%;top:8%}
  .bookObject{width:min(68vw,270px);transform:translateY(2px)}
  .copy{padding:0 0 31px;justify-content:flex-start}
  h1{margin:20px 0 14px;font-size:clamp(48px,13vw,66px)}
  .lede{font-size:15px;line-height:1.64}
  .why{grid-template-columns:72px 1fr;gap:16px;margin-top:22px}
  .shelf{margin-top:26px}
  .footer{min-height:66px}
  .footerText{display:none}
}
@media(prefers-reduced-motion:reduce){
  .bookObject,.copy{animation:none}
}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">82TRADE</div>
    <div class="headerMeta"><span>CURATED READING</span><span>STUDY 07</span></div>
  </header>
  <main class="scene">
    <div class="visual">
      <div class="bookObject">
        <img src="./assets/books/reminiscences-object.webp" alt="股票作手回憶錄實體書">
      </div>
    </div>
    <section class="copy">
      <div class="kicker">03 / 交易必讀</div>
      <h1>股票作手回憶錄</h1>
      <p class="lede">不是教你背招式，而是把一個交易者如何等待、貪婪、恐懼、犯錯，完整攤在你面前。</p>
      <div class="why">
        <div class="whyLabel">Why read</div>
        <p class="whyText">先理解人，再理解市場。最值得重讀的，是你開始在書裡認出自己。</p>
      </div>
      <div class="shelf">
        <div class="row"><small>01</small><b>亞當理論</b><em></em></div>
        <div class="row"><small>02</small><b>交易聖經</b><em></em></div>
        <div class="row" data-selected="true"><small>03</small><b>股票作手回憶錄</b><em>SELECTED</em></div>
        <div class="row"><small>04</small><b>量價分析</b><em></em></div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="footerText">← Previous</div>
    <div class="pager"><span>01</span><span>02</span><span class="active">03</span><span>04</span></div>
    <div class="footerText">Next →</div>
  </footer>
</div>
</body>
</html>
