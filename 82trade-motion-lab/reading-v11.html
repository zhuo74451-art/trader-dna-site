<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>82TRADE — Reading Study 11</title>
<style>
:root{
  --bg:#0a0b0d;
  --ink:#f3f1ed;
  --soft:#b5b2ae;
  --muted:#77756f;
  --line:rgba(255,255,255,.09);
  --blue:#6ea0ff;
  --sans:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU",Iowan Old Style,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.72,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
.page{min-height:100svh;padding:0 3.4vw 16px;display:grid;grid-template-rows:64px minmax(700px,1fr) 74px;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:14px;font-weight:850;letter-spacing:-.04em}
.headerMeta{color:#60636b;font-size:8px;font-weight:680;letter-spacing:.16em;text-transform:uppercase}

.stage{position:relative;display:grid;grid-template-columns:minmax(520px,.98fr) minmax(0,1.02fr);min-height:700px}
.stage:after{
  content:"";position:absolute;left:-3.4vw;right:-3.4vw;bottom:0;height:20%;
  background:linear-gradient(180deg,rgba(255,255,255,.002),rgba(255,255,255,.018));
  clip-path:polygon(7% 30%,93% 30%,100% 100%,0 100%);pointer-events:none
}
.visual{position:relative;z-index:2;display:grid;place-items:center;min-width:0}
.visual:before{
  content:"";position:absolute;width:58%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.055),rgba(255,255,255,.014) 46%,transparent 72%);
  filter:blur(16px);transform:translate(2%,-2%)
}
.visual:after{
  content:"";position:absolute;width:58%;height:66px;bottom:10%;
  background:radial-gradient(ellipse,rgba(0,0,0,.64),rgba(0,0,0,.12) 54%,transparent 76%);
  filter:blur(10px)
}
.book{
  position:relative;z-index:3;width:min(31vw,455px);display:grid;place-items:center;
  transform:translateX(-1vw);will-change:transform,opacity,filter
}
.book img{
  width:100%;height:auto;max-height:610px;display:block;object-fit:contain;
  filter:drop-shadow(-22px 34px 32px rgba(0,0,0,.38)) drop-shadow(0 54px 62px rgba(0,0,0,.18))
}
.book.out{animation:bookOut .26s ease both}
.book.in{animation:bookIn .62s var(--ease) both}
@keyframes bookOut{
  to{opacity:0;transform:translateX(calc(-1vw - 54px)) translateY(7px) rotate(-1.4deg) scale(.97);filter:blur(2px)}
}
@keyframes bookIn{
  from{opacity:0;transform:translateX(calc(-1vw + 58px)) translateY(11px) rotate(1.4deg) scale(.96);filter:blur(2px)}
  to{opacity:1;transform:translateX(-1vw);filter:none}
}

.copy{
  position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;
  padding:6vh 3vw 11vh 2vw;min-width:0;transition:opacity .2s ease,transform .28s ease
}
.copy.out{opacity:0;transform:translateY(10px)}
.copy.in{animation:copyIn .44s ease both}
@keyframes copyIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:8px;font-weight:760;letter-spacing:.18em;text-transform:uppercase}
.kicker:before{content:"";width:30px;height:1px;background:var(--blue)}
.title{
  margin:30px 0 20px;max-width:720px;font-family:var(--serif);font-size:clamp(58px,5vw,80px);
  line-height:.95;font-weight:430;letter-spacing:-.045em
}
.lede{max-width:610px;margin:0;color:var(--soft);font-family:var(--serif);font-size:16.5px;line-height:1.7}
.why{
  max-width:610px;margin-top:32px;padding-top:18px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px
}
.why span{color:#555960;font-size:8px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.why p{margin:0;color:#c6c4c0;font-size:12px;line-height:1.63}

.nav{position:relative;z-index:6;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:stretch}
.tabs{display:flex;align-items:stretch}
.tab{
  min-width:182px;height:74px;padding:0 24px 0 0;margin-right:28px;border:0;border-right:1px solid var(--line);
  background:transparent;display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;text-align:left;color:#5f6269;cursor:pointer
}
.tab small{font-size:8px;letter-spacing:.12em}.tab b{font-size:11px;font-weight:560}
.tab[data-active="true"]{color:#f4f2ed}.tab[data-active="true"] small{color:var(--blue)}
.controls{display:flex;align-items:center;gap:8px;padding-left:22px}
.arrow{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#676a72;cursor:pointer;transition:color .16s,border-color .16s,transform .16s}
.arrow:hover{color:#fff;border-color:rgba(255,255,255,.3);transform:translateY(-2px)}

@media(max-width:900px){
  .page{padding:0 18px 14px;grid-template-rows:60px auto 68px;overflow:visible}
  .stage{grid-template-columns:1fr;min-height:0}
  .visual{min-height:440px;padding-top:10px}
  .visual:before{width:74%}
  .visual:after{width:70%;bottom:8%}
  .book{width:min(78vw,322px);transform:none}
  .book img{max-height:405px}
  .copy{padding:0 0 30px;justify-content:flex-start}
  .title{margin:19px 0 14px;font-size:clamp(43px,11.8vw,58px);line-height:.98}
  .lede{font-size:14.5px;line-height:1.6}
  .why{margin-top:21px;grid-template-columns:66px 1fr;gap:13px}
  .nav{grid-template-columns:1fr;overflow:hidden}
  .tabs{overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{min-width:150px;height:68px;margin-right:18px;padding-right:18px;grid-template-columns:28px 1fr}
  .controls{display:none}
  @keyframes bookOut{to{opacity:0;transform:translateX(-42px) translateY(7px) scale(.97);filter:blur(2px)}}
  @keyframes bookIn{from{opacity:0;transform:translateX(42px) translateY(10px) scale(.96);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
}
@media(prefers-reduced-motion:reduce){.book,.copy,.arrow{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">82TRADE</div>
    <div class="headerMeta" data-header-meta>Reading List · 01 / 03</div>
  </header>

  <section class="stage">
    <div class="visual">
      <div class="book" data-book>
        <img data-image src="./assets/books/reminiscences-object-hq.webp" alt="股票作手回憶錄">
      </div>
    </div>

    <article class="copy" data-copy>
      <div class="kicker" data-kicker>01 / 交易必備</div>
      <h1 class="title" data-title>股票作手回憶錄</h1>
      <p class="lede" data-lede>不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。</p>
      <div class="why"><span>Why read</span><p data-why>先理解人，再理解市場。讀完它，你不一定會立刻交易得更好，但會更早認出自己什麼時候正在犯錯。</p></div>
    </article>
  </section>

  <nav class="nav" aria-label="Reading categories">
    <div class="tabs">
      <button class="tab" type="button" data-tab="0" data-active="true"><small>01</small><b>交易必備</b></button>
      <button class="tab" type="button" data-tab="1" data-active="false"><small>02</small><b>技術分析</b></button>
      <button class="tab" type="button" data-tab="2" data-active="false"><small>03</small><b>思維成長</b></button>
    </div>
    <div class="controls">
      <button class="arrow" type="button" data-dir="-1" aria-label="上一冊">←</button>
      <button class="arrow" type="button" data-dir="1" aria-label="下一冊">→</button>
    </div>
  </nav>
</div>
<script>
const books=[
  {category:"交易必備",title:"股票作手回憶錄",image:"./assets/books/reminiscences-object-hq.webp",lede:"不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。",why:"先理解人，再理解市場。讀完它，你不一定會立刻交易得更好，但會更早認出自己什麼時候正在犯錯。"},
  {category:"技術分析",title:"技術分析聖經",image:"./assets/books/technical-analysis-real.webp",lede:"把圖表、趨勢與市場行為放回一個完整框架。不是為了背更多形態，而是讓你的判斷有一套共同語言。",why:"適合從零散技巧進入系統閱讀：知道自己看到的是什麼，也知道什麼時候不該出手。"},
  {category:"思維成長",title:"納瓦爾寶典",image:"./assets/books/naval.webp",lede:"把視角從單次輸贏拉回長期複利：判斷、選擇、專注與自由。它不是交易書，但很適合交易者。",why:"交易之外，你仍然需要一套關於時間、決策與長期主義的底層坐標。"}
];
books.forEach(({image})=>{const i=new Image();i.src=image});
let index=0,locked=false;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const book=$("[data-book]"),copy=$("[data-copy]");
function render(i){
  const x=books[i];
  $("[data-image]").src=x.image;$("[data-image]").alt=x.title;
  $("[data-kicker]").textContent="0"+(i+1)+" / "+x.category;
  $("[data-title]").textContent=x.title;$("[data-lede]").textContent=x.lede;$("[data-why]").textContent=x.why;
  $("[data-header-meta]").textContent="Reading List · 0"+(i+1)+" / 03";
  $$("[data-tab]").forEach((b,n)=>b.dataset.active=String(n===i));
}
function go(next){
  if(locked||next===index)return;locked=true;next=(next+books.length)%books.length;
  book.classList.remove("in");copy.classList.remove("in");book.classList.add("out");copy.classList.add("out");
  setTimeout(()=>{
    index=next;render(index);book.classList.remove("out");copy.classList.remove("out");void book.offsetWidth;
    book.classList.add("in");copy.classList.add("in");
    setTimeout(()=>{book.classList.remove("in");copy.classList.remove("in");locked=false},650);
  },260);
}
$$("[data-tab]").forEach((b,i)=>b.addEventListener("click",()=>go(i)));
$$("[data-dir]").forEach(b=>b.addEventListener("click",()=>go(index+(Number(b.dataset.dir)||1))));
</script>
</body>
</html>
