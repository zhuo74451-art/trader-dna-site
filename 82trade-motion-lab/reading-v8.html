<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>82TRADE — Reading Study 08</title>
<style>
:root{
  --bg:#0c0d0f;--ink:#f4f1eb;--muted:#a9a8ad;--dim:#63656b;--line:rgba(255,255,255,.105);
  --blue:#75a3ff;--sans:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU",Iowan Old Style,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.78,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
.page{min-height:100svh;padding:0 3.4vw 18px;display:grid;grid-template-rows:64px 1fr 82px;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:14px;font-weight:850;letter-spacing:-.04em}
.headerMeta{color:#66686f;font-size:8px;font-weight:680;letter-spacing:.16em;text-transform:uppercase}

.stage{position:relative;min-height:690px;display:grid;grid-template-columns:minmax(500px,.98fr) minmax(0,1.02fr)}
.stage:after{
  content:"";position:absolute;left:-3.4vw;right:-3.4vw;bottom:0;height:21%;
  background:linear-gradient(180deg,rgba(255,255,255,.003),rgba(255,255,255,.024));
  clip-path:polygon(7% 30%,93% 30%,100% 100%,0 100%);pointer-events:none
}
.visual{position:relative;z-index:2;display:grid;place-items:center;min-width:0}
.visual:before{
  content:"";position:absolute;width:min(500px,60%);height:58%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.065),rgba(255,255,255,.016) 46%,transparent 72%);
  filter:blur(18px);transform:translate(4%,-3%)
}
.visual:after{
  content:"";position:absolute;width:61%;height:70px;bottom:11%;
  background:radial-gradient(ellipse,rgba(0,0,0,.7),rgba(0,0,0,.14) 52%,transparent 74%);
  filter:blur(11px);transform:rotate(-2deg)
}
.book{
  position:relative;z-index:3;width:min(31vw,455px);max-height:630px;display:grid;place-items:center;
  transform:translateX(1.8vw);transform-origin:50% 84%;will-change:transform,opacity,filter
}
.book img{
  width:100%;height:auto;max-height:630px;display:block;object-fit:contain;
  filter:drop-shadow(-24px 36px 36px rgba(0,0,0,.44)) drop-shadow(0 58px 72px rgba(0,0,0,.16))
}
.book.out{animation:bookOut .3s ease both}.book.in{animation:bookIn .72s var(--ease) both}
@keyframes bookOut{to{opacity:0;transform:translateX(calc(1.8vw - 62px)) translateY(8px) rotate(-2deg) scale(.96);filter:blur(3px)}}
@keyframes bookIn{from{opacity:0;transform:translateX(calc(1.8vw + 68px)) translateY(14px) rotate(2deg) scale(.95);filter:blur(3px)}to{opacity:1;transform:translateX(1.8vw);filter:none}}

.copy{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:5vh 3vw 10vh 2.5vw;min-width:0}
.copy.out{animation:copyOut .24s ease both}.copy.in{animation:copyIn .48s ease both}
@keyframes copyOut{to{opacity:0;transform:translateY(10px)}}@keyframes copyIn{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:8px;font-weight:760;letter-spacing:.18em;text-transform:uppercase}
.kicker:before{content:"";width:30px;height:1px;background:var(--blue)}
.title{margin:29px 0 20px;max-width:720px;font-family:var(--serif);font-size:clamp(56px,4.9vw,78px);line-height:.95;font-weight:400;letter-spacing:-.045em}
.lede{max-width:600px;margin:0;color:#aaa9ae;font-family:var(--serif);font-size:16.5px;line-height:1.68}
.why{max-width:600px;margin-top:29px;padding-top:17px;border-top:1px solid var(--line);display:grid;grid-template-columns:74px 1fr;gap:18px}
.why span{color:#62646b;font-size:8px;letter-spacing:.14em;text-transform:uppercase}
.why p{margin:0;color:#d1d0d3;font-size:12px;line-height:1.64}

.nav{position:relative;z-index:6;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:stretch}
.tabs{display:flex;align-items:stretch}
.tab{
  min-width:190px;height:82px;padding:0 26px 0 0;margin-right:27px;border:0;border-right:1px solid var(--line);
  background:transparent;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;text-align:left;color:#62646a;cursor:pointer
}
.tab small{font-size:8px;letter-spacing:.12em}.tab b{font-size:12px;font-weight:560}
.tab[data-active="true"]{color:#f4f1eb}.tab[data-active="true"] small{color:var(--blue)}
.controls{display:flex;align-items:center;gap:8px;padding-left:26px}
.arrow{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#73757d;cursor:pointer;transition:color .2s,border-color .2s,transform .2s}
.arrow:hover{color:#fff;border-color:rgba(255,255,255,.28);transform:translateY(-2px)}

@media(max-width:900px){
  .page{padding:0 18px 18px;grid-template-rows:60px auto 68px;overflow:visible}
  .headerMeta{font-size:7px}
  .stage{grid-template-columns:1fr;min-height:0}
  .visual{min-height:445px;padding:18px 0 0}
  .visual:before{width:76%;height:66%}
  .book{width:min(76vw,315px);max-height:405px;transform:none}
  .book img{max-height:405px}
  .visual:after{width:72%;bottom:8%}
  .copy{padding:4px 0 30px;justify-content:flex-start}
  .title{margin:19px 0 14px;font-size:clamp(42px,11.5vw,56px);line-height:.98}
  .lede{font-size:14.5px;line-height:1.58}
  .why{margin-top:20px;grid-template-columns:66px 1fr;gap:13px}
  .nav{grid-template-columns:1fr;overflow:hidden}
  .tabs{overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{min-width:150px;height:68px;margin-right:18px;padding-right:18px;grid-template-columns:28px 1fr}
  .controls{display:none}
}
@media(prefers-reduced-motion:reduce){.book,.copy,.arrow{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">82TRADE</div>
    <div class="headerMeta" data-header-meta>Reading List · 01 / 03</div>
  </header>
  <section class="stage">
    <div class="visual">
      <div class="book" data-book>
        <img data-book-image src="./assets/books/reminiscences-object.webp" alt="股票作手回憶錄">
      </div>
    </div>
    <article class="copy" data-copy>
      <div class="kicker" data-kicker>01 / 交易必備</div>
      <h1 class="title" data-title>股票作手回憶錄</h1>
      <p class="lede" data-lede>不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。</p>
      <div class="why"><span>Why read</span><p data-why>先理解人，再理解市場。讀完它，你不一定會立刻交易得更好，但會更早認出自己什麼時候正在犯錯。</p></div>
    </article>
  </section>
  <nav class="nav" aria-label="Reading categories">
    <div class="tabs">
      <button class="tab" type="button" data-tab="0" data-active="true"><small>01</small><b>交易必備</b></button>
      <button class="tab" type="button" data-tab="1" data-active="false"><small>02</small><b>技術分析</b></button>
      <button class="tab" type="button" data-tab="2" data-active="false"><small>03</small><b>思維成長</b></button>
    </div>
    <div class="controls">
      <button class="arrow" type="button" data-dir="-1" aria-label="上一冊">←</button>
      <button class="arrow" type="button" data-dir="1" aria-label="下一冊">→</button>
    </div>
  </nav>
</div>
<script>
const books=[
  {category:"交易必備",title:"股票作手回憶錄",image:"./assets/books/reminiscences-object.webp",lede:"不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。",why:"先理解人，再理解市場。讀完它，你不一定會立刻交易得更好，但會更早認出自己什麼時候正在犯錯。"},
  {category:"技術分析",title:"技術分析聖經",image:"./assets/books/technical-analysis-real.webp",lede:"把圖表、趨勢與市場行為放回一個完整框架裡。不是為了背更多形態，而是讓你的判斷有一套共同語言。",why:"適合從零散技巧進入系統閱讀：知道自己看到的是什麼，也知道什麼時候不該出手。"},
  {category:"思維成長",title:"納瓦爾寶典",image:"./assets/books/naval.webp",lede:"把視角從單次輸贏拉回長期複利：判斷、選擇、專注與自由。它不是交易書，但很適合交易者。",why:"交易之外，你仍然需要一套關於時間、決策與長期主義的底層坐標。"}
];
books.forEach(({image})=>{const i=new Image();i.src=image});
let index=0,locked=false;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const book=$("[data-book]"),copy=$("[data-copy]");
function render(i){
  const x=books[i];
  $("[data-book-image]").src=x.image;$("[data-book-image]").alt=x.title+"封面";
  $("[data-kicker]").textContent="0"+(i+1)+" / "+x.category;$("[data-title]").textContent=x.title;
  $("[data-lede]").textContent=x.lede;$("[data-why]").textContent=x.why;
  $("[data-header-meta]").textContent="Reading List · 0"+(i+1)+" / 03";
  $$("[data-tab]").forEach((b,n)=>b.dataset.active=String(n===i));
}
function go(next){
  if(locked||next===index)return;
  locked=true;next=(next+books.length)%books.length;
  book.classList.remove("in");copy.classList.remove("in");
  book.classList.add("out");copy.classList.add("out");
  setTimeout(()=>{
    index=next;render(index);
    book.classList.remove("out");copy.classList.remove("out");
    void book.offsetWidth;
    book.classList.add("in");copy.classList.add("in");
    setTimeout(()=>{book.classList.remove("in");copy.classList.remove("in");locked=false},760);
  },280);
}
$$("[data-tab]").forEach((b,i)=>b.addEventListener("click",()=>go(i)));
$$("[data-dir]").forEach(b=>b.addEventListener("click",()=>go(index+(Number(b.dataset.dir)||1))));
</script>
</body>
</html>
