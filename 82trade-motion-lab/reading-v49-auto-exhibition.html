/*
Host data contract:
window.__82TRADE_READING_BOOKS__ = [{
  id, title, author, category, cover, reason, note,
  cloth: "#303133" | 0x303133,
  thickness: 0.18..0.50,
  scale: 0.85..1.10
}];
window.__82TRADE_READING_INITIAL_INDEX__ = 0..N-1;
*/
function asText(value,fallback){return typeof value==="string"&&value.trim()?value.trim():fallback}
function asNumber(value,fallback,min,max){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback;
}
function asCloth(value,fallback){
  try{
    if(typeof value==="string"&&value.trim())return new THREE.Color(value.trim()).getHex();
    if(Number.isFinite(value))return value;
  }catch{}
  return fallback;
}
function normalizeBook(raw,i){
  const fallback=DEFAULT_BOOKS[i%DEFAULT_BOOKS.length];
  const x=raw&&typeof raw==="object"?raw:{};
  return {
    id:asText(x.id,`reading-${i+1}`),
    title:asText(x.title,fallback.title),
    author:asText(x.author,fallback.author),
    category:asText(x.category,fallback.category),
    cover:asText(x.cover,fallback.cover),
    reason:asText(x.reason,fallback.reason),
    note:asText(x.note,fallback.note),
    cloth:asCloth(x.cloth,fallback.cloth),
    thickness:asNumber(x.thickness,fallback.thickness,.18,.50),
    scale:asNumber(x.scale,fallback.scale,.85,1.10)
  };
}
const hostBooks=Array.isArray(window.__82TRADE_READING_BOOKS__)&&window.__82TRADE_READING_BOOKS__.length
  ?window.__82TRADE_READING_BOOKS__
  :DEFAULT_BOOKS;
const BOOKS=hostBooks.map(normalizeBook);


const shell=document.querySelector("[data-reading-carousel]");
const stage=shell.querySelector("[data-reading-stage]");
const detailCopy=shell.querySelector("#detailCopy");
const detailIndex=shell.querySelector("[data-reading-index]");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0c0e);

let viewW=Math.max(1,shell.clientWidth),viewH=Math.max(1,shell.clientHeight);

camera.position.set(0,.02,12.2);

const BASELINE=-1.82;
const FLOOR_Y=-1.826;

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(30,14),
  new THREE.ShadowMaterial({color:0x000000,opacity:.46,transparent:true})
);
floor.rotation.x=-Math.PI/2;

const loader=new THREE.TextureLoader();

function paperTexture(){
  const c=document.createElement("canvas");
  c.width=320;c.height=640;
  const ctx=c.getContext("2d");
  ctx.fillStyle="#e8e4dc";ctx.fillRect(0,0,c.width,c.height);
  for(let y=2;y<c.height;y+=2.6){
    const a=.035+Math.random()*.06;
    ctx.fillStyle="rgba(81,74,65,"+a+")";
    ctx.fillRect(0,y,c.width,Math.random()>.86?1.1:.45);
  }
  for(let i=0;i<1100;i++){
    const g=Math.floor(150+Math.random()*60);
    ctx.fillStyle="rgba("+g+","+g+","+g+","+(Math.random()*.035)+")";
    ctx.fillRect(Math.random()*c.width,Math.random()*c.height,Math.random()*1.3+.25,Math.random()*.9+.2);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

function clothTexture(){
  const c=document.createElement("canvas");
  c.width=320;c.height=320;
  const ctx=c.getContext("2d");
  const img=ctx.createImageData(c.width,c.height);
  for(let i=0;i<img.data.length;i+=4){
    const v=118+Math.floor(Math.random()*108);
    img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  // faint woven structure
  ctx.globalAlpha=.15;
  ctx.strokeStyle="#777";
  for(let x=0;x<c.width;x+=3){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<c.height;y+=3){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(5,7);
  return t;
}

const pageTex=paperTexture();
const clothTex=clothTexture();

function clothMat(color){
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness:.79,
    roughnessMap:clothTex,
    bumpMap:clothTex,
    bumpScale:.0045,
    metalness:0,
    clearcoat:.018,
    clearcoatRoughness:.94,
    sheen:.13,
    sheenRoughness:.96,
    sheenColor:new THREE.Color(color)
  });
}

function coverPrintMat(tex){
  const mat=new THREE.MeshBasicMaterial({
    map:tex,
    color:0xffffff,
    side:THREE.FrontSide
  });
  mat.toneMapped=false;
  return mat;
}
function coverSheenMat(){
  return new THREE.MeshPhysicalMaterial({
    color:0xffffff,
    transparent:true,
    opacity:.072,
    roughness:.27,
    metalness:0,
    clearcoat:.48,
    clearcoatRoughness:.46,
    depthWrite:false,
    blending:THREE.NormalBlending
  });
}

function fallbackCover(book){
  const canvas=document.createElement("canvas");
  canvas.width=900;canvas.height=1350;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#17191c";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=3;ctx.strokeRect(26,26,848,1298);
  ctx.fillStyle="#f2efe8";ctx.font="600 42px -apple-system,BlinkMacSystemFont,sans-serif";
  ctx.fillText("82TRADE / READING",64,105);
  ctx.font="500 82px Georgia,serif";
  const words=Array.from(book.title);
  let line="",y=330;
  for(const ch of words){
    const test=line+ch;
    if(ctx.measureText(test).width>760&&line){ctx.fillText(line,64,y);line=ch;y+=102}
    else line=test;
  }
  if(line)ctx.fillText(line,64,y);
  ctx.fillStyle="rgba(242,239,232,.58)";ctx.font="400 34px -apple-system,BlinkMacSystemFont,sans-serif";
  ctx.fillText(book.author,64,1190);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  return {tex,ratio:2/3,assetStatus:"fallback"};
}
async function loadBookAsset(book){
  try{
    const tex=await loader.loadAsync(book.cover);
    tex.colorSpace=THREE.SRGBColorSpace;
    tex.anisotropy=Math.min(12,renderer.capabilities.getMaxAnisotropy());
    const iw=tex.image?.naturalWidth||tex.image?.width||800;
    const ih=tex.image?.naturalHeight||tex.image?.height||1200;
    return {...book,tex,ratio:iw/ih,assetStatus:"ok"};
  }catch(error){
    const fallback=fallbackCover(book);
    return {...book,...fallback};
  }
}
const loaded=await Promise.all(BOOKS.map(loadBookAsset));

const books=[];

function makeBook(book,index){
  const g=new THREE.Group();
  g.userData.index=index;

  const h=2.98*book.scale;
  const w=h*book.ratio;
  const totalD=book.thickness*1.45;
  const boardD=.045;
  const pageD=Math.max(.15,totalD-.078);
  const over=.050;
  const corner=.026;

  // Inset page block.
  const pages=new THREE.Mesh(
    new THREE.BoxGeometry(w-.105,h-.115,pageD),
    [
      new THREE.MeshStandardMaterial({map:pageTex,color:0xe4dfd6,roughness:.98}),
      new THREE.MeshStandardMaterial({color:0xc9c4bb,roughness:.98}),
      new THREE.MeshStandardMaterial({map:pageTex,color:0xe8e4dc,roughness:.98}),
      new THREE.MeshStandardMaterial({map:pageTex,color:0xded9cf,roughness:.99}),
      new THREE.MeshStandardMaterial({color:0xd7d2c9,roughness:.99}),
      new THREE.MeshStandardMaterial({color:0xd4cfc6,roughness:.99})
    ]
  );
  pages.position.x=.028;
  pages.castShadow=true;
  pages.receiveShadow=true;
  g.add(pages);

  // Rounded fore-edge: catches a narrow highlight when the book turns.
  const foreEdge=new THREE.Mesh(
    new RoundedBoxGeometry(.040,h-.145,pageD-.010,5,.018),
    new THREE.MeshStandardMaterial({map:pageTex,color:0xe7e1d7,roughness:.99})
  );
  foreEdge.position.x=(w-.105)/2+.018;
  foreEdge.castShadow=true;
  foreEdge.receiveShadow=true;
  g.add(foreEdge);

  // Tiny dark contact lines between page block and boards sell the inset.
  const aoMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false});
  for(const z of [pageD/2+.004,-pageD/2-.004]){
    const ao=new THREE.Mesh(new THREE.PlaneGeometry(w-.17,.018),aoMat);
    ao.rotation.x=Math.PI/2;
    ao.position.set(.035,h/2-.072,z);
    g.add(ao);
  }

  const boardGeom=new RoundedBoxGeometry(w+over*2,h+over*2,boardD,5,corner);
  const boardMaterial=clothMat(book.cloth);

  const frontBoard=new THREE.Mesh(boardGeom,boardMaterial);
  frontBoard.position.z=pageD/2+boardD/2+.011;
  frontBoard.castShadow=true;
  frontBoard.receiveShadow=true;
  g.add(frontBoard);

  const backBoard=new THREE.Mesh(boardGeom,boardMaterial);
  backBoard.position.z=-(pageD/2+boardD/2+.011);
  backBoard.castShadow=true;
  backBoard.receiveShadow=true;
  g.add(backBoard);

  // Full-bleed print lies almost flush on the board: no UI-like border.
  const art=new THREE.Mesh(
    new THREE.PlaneGeometry(w+over*1.62,h+over*1.62),
    coverPrintMat(book.tex)
  );
  art.position.z=frontBoard.position.z+boardD/2+.0025;
  g.add(art);

  const sheen=new THREE.Mesh(
    new THREE.PlaneGeometry(w+over*1.64,h+over*1.64),
    coverSheenMat()
  );
  sheen.position.z=art.position.z+.0015;
  g.add(sheen);

  // Rounded spine, physically separate from page deck.
  const spineW=.095;
  const spine=new THREE.Mesh(
    new RoundedBoxGeometry(spineW,h+over*1.72,totalD+.052,8,.043),
    clothMat(book.cloth)
  );
  spine.position.x=-(w/2+spineW*.22);
  spine.castShadow=true;
  spine.receiveShadow=true;
  g.add(spine);

  // Subtle hinge gutters.
  const hingeMat=new THREE.MeshStandardMaterial({color:book.cloth,roughness:.82});
  for(const z of [pageD/2+.034,-pageD/2-.034]){
    const groove=new THREE.Mesh(new RoundedBoxGeometry(.022,h-.13,.022,3,.009),hingeMat);
    groove.position.set(-(w/2-.040),0,z);
    groove.castShadow=true;
    g.add(groove);
  }

  // Head/tail bands. Tiny but visible at oblique angles.
  const bandMat=new THREE.MeshStandardMaterial({color:0x8d8376,roughness:.9});
  for(const y of [h/2-.050,-h/2+.050]){
    const band=new THREE.Mesh(new RoundedBoxGeometry(.105,.026,pageD+.012,3,.009),bandMat);
    band.position.set(-(w/2-.048),y,0);
    g.add(band);
  }

  root.add(g);
  books.push({group:g,w,h});
}

loaded.forEach(makeBook);

const n=books.length;
const ARC_RADIUS=20.2;
const ARC_STEP=.128;
const requestedInitial=Math.round(Number(window.__82TRADE_READING_INITIAL_INDEX__??Math.min(2,n-1)));
const initialIndex=Math.max(0,Math.min(n-1,Number.isFinite(requestedInitial)?requestedInitial:0));

let position=initialIndex,velocity=0,target=initialIndex;
let dragging=false,pointerId=null,dragStartX=0,dragStartPos=0,lastX=0,lastT=performance.now(),dragDistance=0;
let selected=-1;
const finePointer=matchMedia("(pointer:fine)").matches && !reduceMotion;
let hoverYaw=0,hoverPitch=0,hoverYawTarget=0,hoverPitchTarget=0;

// Secondary delight only: the accepted 3D carousel remains the signature moment.
const AUTO_ADVANCE_MS=5600;
const AUTO_RESUME_MS=2600;
let lastInteractionAt=performance.now();
let nextAutoAt=lastInteractionAt+AUTO_ADVANCE_MS;
let idleYaw=0,idleYawTarget=0;

function markInteraction(now=performance.now()){
  lastInteractionAt=now;
  nextAutoAt=now+AUTO_RESUME_MS+AUTO_ADVANCE_MS;
  idleYawTarget=0;
}

function mod(v,m){return((v%m)+m)%m}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function shortestDelta(index,pos){
  let d=index-mod(pos,n);
  if(d>n/2)d-=n;
  if(d<-n/2)d+=n;
  return d;
}

function setSelected(i){
  i=mod(i,n);
  if(i===selected)return;
  selected=i;
  const b=BOOKS[i];
  const counter=String(i+1).padStart(2,"0")+" / "+String(n).padStart(2,"0");
  detailIndex.textContent=counter;
  detailCategory.textContent=b.category;
  detailTitle.textContent=b.title;
  detailAuthor.textContent=b.author;
  detailReason.textContent=b.reason;
  detailNote.textContent=b.note;
  shell.dataset.readingIndex=String(i);
  shell.dataset.readingId=b.id;
  shell.setAttribute("aria-label",`82TRADE 推薦閱讀：目前是 ${b.title}，第 ${i+1} 本，共 ${n} 本。拖動或使用左右方向鍵選書。`);
  shell.dispatchEvent(new CustomEvent("readingchange",{
    bubbles:true,
    detail:{index:i,count:n,book:{id:b.id,title:b.title,author:b.author,category:b.category,cover:b.cover,assetStatus:loaded[i]?.assetStatus||"ok"}}
  }));
  if(!reduceMotion && detailCopy){
    detailCopy.animate(
      [{opacity:.28,transform:"translateY(7px)"},{opacity:1,transform:"translateY(0)"}],
      {duration:280,easing:"cubic-bezier(.22,.72,.18,1)"}
    );
  }
}

function layout(){
  let nearest=0,nearestAbs=999;
  books.forEach((item,i)=>{
    const d=shortestDelta(i,position);
    const theta=d*ARC_STEP;
    const abs=Math.abs(d);
    const x=Math.sin(theta)*ARC_RADIUS;
    const z=-Math.min(abs*.16,.34);
    const center=Math.max(0,1-abs);

    // Shared baseline. The selected book settles slightly toward the viewer,
    // but stays physically planted instead of "hero floating".
    const focus=1-clamp(abs,0,1);
    const s=1+focus*.012;
    item.group.scale.setScalar(s);
    item.group.position.set(
      x,
      BASELINE+(item.h*s)/2,
      z+focus*.105
    );
    const donorYaw=-clamp(theta*1.55,-.22,.22);
    item.group.rotation.y=donorYaw*(1-focus*.28)+(focus>.98?(hoverYaw+idleYaw):0);
    item.group.rotation.x=focus>.98?hoverPitch:0;
    item.group.rotation.z=0;

    if(abs<nearestAbs){nearestAbs=abs;nearest=i}
  });
  setSelected(nearest);
}
layout();

renderer.domElement.addEventListener("pointerdown",e=>{
  markInteraction();
  shell.focus({preventScroll:true});
  dragging=true;pointerId=e.pointerId;renderer.domElement.setPointerCapture(pointerId);
  hoverYawTarget=0;hoverPitchTarget=0;
  dragStartX=lastX=e.clientX;dragStartPos=position;lastT=performance.now();velocity=0;dragDistance=0;
  renderer.domElement.classList.add("dragging");
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(finePointer){
    markInteraction();
    const r=renderer.domElement.getBoundingClientRect();
    const nx=clamp(((e.clientX-r.left)/r.width)*2-1,-1,1);
    const ny=clamp(((e.clientY-r.top)/r.height)*2-1,-1,1);
    // Under two degrees: enough to expose thickness, never enough to feel like a tilt card.
    hoverYawTarget=dragging?0:nx*.030;
    hoverPitchTarget=dragging?0:-ny*.008;
  }
  if(!dragging||e.pointerId!==pointerId)return;
  const now=performance.now(),dx=e.clientX-dragStartX;
  const px=shell.clientWidth<760?165:(shell.clientWidth<=1180?220:260);
  position=dragStartPos-dx/px;
  const dt=Math.max(8,now-lastT);
  velocity=-(e.clientX-lastX)/px/(dt/1000);
  dragDistance=Math.max(dragDistance,Math.abs(dx));
  lastX=e.clientX;lastT=now;
});
renderer.domElement.addEventListener("pointerleave",()=>{
  hoverYawTarget=0;hoverPitchTarget=0;
});
function release(){
  if(!dragging)return;
  markInteraction();
  dragging=false;renderer.domElement.classList.remove("dragging");
  try{renderer.domElement.releasePointerCapture(pointerId)}catch{}
  if(reduceMotion){position=Math.round(position);target=position;velocity=0}
  else target=Math.round(position+clamp(velocity*.10,-.65,.65));
}
renderer.domElement.addEventListener("pointerup",release);
renderer.domElement.addEventListener("pointercancel",release);

renderer.domElement.addEventListener("wheel",e=>{
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)*.78)return;
  markInteraction();
  e.preventDefault();
  target=Math.round(target+clamp(e.deltaX*.0025,-.7,.7));
},{passive:false});

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener("click",e=>{
  if(dragDistance>7)return;
  markInteraction();
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(books.map(x=>x.group),true);
  if(!hits.length)return;
  let o=hits[0].object;
  while(o.parent&&o.parent!==root)o=o.parent;
  if(o.userData.index==null)return;
  target=position+shortestDelta(o.userData.index,position);
});

shell.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){
    markInteraction();
    e.preventDefault();
    target=Math.round(target)-1;
  }
  if(e.key==="ArrowRight"){
    markInteraction();
    e.preventDefault();
    target=Math.round(target)+1;
  }
});

function placeRoot(scale,x=0){
  root.scale.setScalar(scale);
  // Keep the local BASELINE glued to the same world-space floor after scaling.
  root.position.y=(FLOOR_Y+.006)-BASELINE*scale;
  root.position.x=x;
}
function resize(){
  viewW=Math.max(1,shell.clientWidth);
  viewH=Math.max(1,shell.clientHeight);
  renderer.setSize(viewW,viewH,false);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  camera.aspect=viewW/viewH;

  if(viewW<760){
    // Keep the books physically grounded, but frame them in the upper-middle
    // so the mobile detail block has room without a dead black void.
    camera.fov=45;
    camera.position.set(0,.02,14.25);
    camera.lookAt(0,-.92,-.55);
    placeRoot(.78,0);
  }else if(viewW<=1180){
    camera.fov=35;
    camera.position.set(0,.02,13.15);
    camera.lookAt(0,-.62,-.55);
    placeRoot(.88,-.10);
  }else{
    camera.fov=28;
    camera.position.set(0,.02,12.2);
    camera.lookAt(0,-.18,-.55);
    placeRoot(1,-.74);
  }
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(shell);
addEventListener("resize",resize,{passive:true});
resize();
shell.dataset.readingReady="true";
shell.dataset.autoExhibition=reduceMotion?"off":"on";
shell.dispatchEvent(new CustomEvent("readingready",{
  bubbles:true,
  detail:{count:n,initialIndex,usedFallbackAssets:loaded.filter(x=>x.assetStatus==="fallback").map(x=>x.id)}
}));

let prev=performance.now();
let pageVisible=!document.hidden;
let sectionVisible=true;
let active=pageVisible&&sectionVisible;
function syncActive(){
  active=pageVisible&&sectionVisible;
  prev=performance.now();
  if(active){
    lastInteractionAt=prev;
    nextAutoAt=prev+AUTO_ADVANCE_MS;
  }
}
document.addEventListener("visibilitychange",()=>{pageVisible=!document.hidden;syncActive()});
new IntersectionObserver(([entry])=>{
  sectionVisible=entry.isIntersecting;
  syncActive();
},{threshold:.01}).observe(shell);
function tick(now){
  requestAnimationFrame(tick);
  if(!active){prev=now;return}
  const dt=Math.min(.033,(now-prev)/1000||.016);prev=now;
  const hoverEase=1-Math.exp(-10*dt);
  hoverYaw+=(hoverYawTarget-hoverYaw)*hoverEase;
  hoverPitch+=(hoverPitchTarget-hoverPitch)*hoverEase;

  const idleFor=now-lastInteractionAt;
  const settled=Math.abs(target-position)<.004&&Math.abs(velocity)<.008;
  if(!reduceMotion&&!dragging&&settled&&idleFor>AUTO_RESUME_MS){
    // Under 0.8 degrees: just enough to reveal that this is a physical book.
    idleYawTarget=Math.sin(now*.00118)*.0135;
  }else{
    idleYawTarget=0;
  }
  const idleEase=1-Math.exp(-3.2*dt);
  idleYaw+=(idleYawTarget-idleYaw)*idleEase;

  if(!dragging){
    if(reduceMotion){position=target;velocity=0;idleYaw=0;idleYawTarget=0}
    else{
      // Auto-advance is deliberate, not continuous: hold → travel → hold.
      if(now>=nextAutoAt&&settled){
        target=Math.round(target)+1;
        nextAutoAt=now+AUTO_ADVANCE_MS;
      }
      velocity+=(target-position)*20.5*dt;
      velocity*=Math.exp(-8.9*dt);
      position+=velocity*dt;
      if(Math.abs(target-position)<.0007&&Math.abs(velocity)<.0014){position=target;velocity=0}
    }
  }
  layout();
  renderer.render(scene,camera);
}
requestAnimationFrame(tick);
</script>
</body>
