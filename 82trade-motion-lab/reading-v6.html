<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>82TRADE — Reading Study 06</title>
<style>
/*
  Donor composition:
  - original reference: object left / editorial note right / switcher below
  - Codrops: 3D object exits before detail state changes
  - book-cover-3d: physical object, not a flat cover card
*/
:root{
  --bg:#0c0d0f;--ink:#f5f2ec;--muted:#a5a4a9;--dim:#64666d;--line:rgba(255,255,255,.105);
  --blue:#75a3ff;--sans:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU",Iowan Old Style,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.78,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
.page{min-height:100svh;padding:0 3.4vw 20px;display:grid;grid-template-rows:66px 1fr 94px;overflow:hidden}
.header{position:relative;z-index:8;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:14px;font-weight:850;letter-spacing:-.04em}
.headerMeta{display:flex;gap:22px;color:#696b72;font-size:8px;letter-spacing:.16em;text-transform:uppercase}

.stage{position:relative;min-height:680px;display:grid;grid-template-columns:minmax(470px,.92fr) minmax(0,1.08fr)}
.stage:after{
  content:"";position:absolute;left:-3.4vw;right:-3.4vw;bottom:0;height:27%;
  background:linear-gradient(180deg,rgba(255,255,255,.006),rgba(255,255,255,.034));
  clip-path:polygon(5% 30%,95% 30%,100% 100%,0 100%);pointer-events:none
}
.objectPane{position:relative;z-index:2;display:grid;place-items:center;min-width:0}
.objectPane:before{
  content:"";position:absolute;width:min(620px,72%);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.05) 29%,rgba(117,163,255,.03) 47%,transparent 70%);
  filter:blur(12px);transform:translate(4%,-2%)
}
.objectPane:after{
  content:"";position:absolute;left:9%;right:5%;bottom:10%;height:82px;
  background:radial-gradient(ellipse,rgba(0,0,0,.72),rgba(0,0,0,.18) 50%,transparent 74%);
  filter:blur(11px);transform:rotate(-2deg)
}
.bookFrame{position:relative;z-index:3;width:min(40vw,590px);height:640px;display:grid;place-items:center;perspective:1200px}
.bookObject{
  position:relative;width:min(27vw,390px);aspect-ratio:2/3;transform-style:preserve-3d;
  transform:translateX(2.5vw) rotateY(-18deg) rotateX(.8deg);
  transition:transform .78s var(--ease),opacity .28s ease,filter .55s ease;
  filter:drop-shadow(-22px 34px 42px rgba(0,0,0,.5))
}
.bookFront{
  position:absolute;inset:0;transform:translateZ(25px);overflow:hidden;border-radius:1px 4px 4px 1px;
  background:#121418;box-shadow:6px 7px 28px rgba(0,0,0,.44)
}
.bookFront img{display:block;width:100%;height:100%;object-fit:cover}
.bookFront:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 13%,transparent 84%,rgba(255,255,255,.07))
}
.bookObject:before{
  content:"";position:absolute;z-index:-1;top:4px;bottom:4px;left:calc(100% - 25px);width:50px;
  transform:rotateY(90deg);transform-origin:left center;
  background:repeating-linear-gradient(90deg,#fbf7ed 0,#fbf7ed 3px,#d6d0c4 4px,#f8f4eb 6px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)
}
.bookObject:after{
  content:"";position:absolute;inset:0;z-index:-2;transform:translateZ(-25px);
  background:#111318;border-radius:1px 4px 4px 1px;box-shadow:-18px 0 50px rgba(0,0,0,.48)
}
.bookObject:hover{transform:translateX(2.5vw) rotateY(-7deg) translateY(-4px)}
.bookObject.is-leaving{opacity:0;transform:translateX(calc(2.5vw - 72px)) rotateY(-58deg) translateY(12px) scale(.94)}
.bookObject.is-entering{animation:bookEnter .82s var(--ease) both}
@keyframes bookEnter{
  from{opacity:0;transform:translateX(calc(2.5vw + 78px)) rotateY(32deg) translateY(14px) scale(.94)}
  to{opacity:1;transform:translateX(2.5vw) rotateY(-18deg) rotateX(.8deg) translateY(0) scale(1)}
}

.copyPane{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:6vh 2vw 10vh 3vw;min-width:0;transition:opacity .28s ease,transform .34s ease}
.copyPane.is-leaving{opacity:0;transform:translateY(17px)}
.copyPane.is-entering{animation:copyEnter .52s ease both}
@keyframes copyEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:8px;font-weight:760;letter-spacing:.18em;text-transform:uppercase}
.kicker:before{content:"";width:30px;height:1px;background:var(--blue)}
.title{margin:30px 0 20px;max-width:720px;font-family:var(--serif);font-size:clamp(56px,4.9vw,78px);line-height:.95;font-weight:400;letter-spacing:-.045em}
.lede{max-width:610px;margin:0;color:#aaa9ae;font-family:var(--serif);font-size:16px;line-height:1.65}
.why{max-width:610px;margin-top:27px;padding-top:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:80px 1fr;gap:20px}
.why span{color:#62646b;font-size:8px;letter-spacing:.14em;text-transform:uppercase}
.why p{margin:0;color:#d0cfd2;font-size:12px;line-height:1.62}
.meta{margin-top:27px;color:#65676e;font-size:8px;letter-spacing:.08em}

.nav{position:relative;z-index:5;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:stretch}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:990px}
.tab{
  min-height:94px;padding:0 28px;border:0;border-right:1px solid var(--line);background:transparent;
  display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;text-align:left;color:#65676e;cursor:pointer
}
.tab small{font-size:8px;letter-spacing:.12em}
.tabCopy{display:flex;flex-direction:column;gap:7px;min-width:0}
.tab b{font-size:11px;font-weight:560}.tab em{font-family:var(--serif);font-size:13px;font-style:normal;color:#55575e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[data-active="true"]{color:#f4f1eb}.tab[data-active="true"] small{color:var(--blue)}.tab[data-active="true"] em{color:#aaa9ae}
.controls{display:flex;align-items:center;gap:8px;padding-left:28px}
.arrow{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#73757d;cursor:pointer;transition:color .2s,border-color .2s,transform .2s}
.arrow:hover{color:#fff;border-color:rgba(255,255,255,.28);transform:translateY(-2px)}

@media(max-width:900px){
  .page{padding:0 18px 18px;grid-template-rows:60px auto 70px;overflow:visible}
  .headerMeta span:first-child{display:none}
  .stage{grid-template-columns:1fr;min-height:0}
  .objectPane{min-height:450px}
  .objectPane:before{width:82%;top:2%}
  .bookFrame{width:340px;height:440px}
  .bookObject{width:min(70vw,286px);aspect-ratio:2/3;transform:rotateY(-12deg) translateY(2px)}
  .bookObject:hover{transform:rotateY(-12deg) translateY(2px)}
  .bookObject:before{left:calc(100% - 20px);width:40px}
  .bookFront{transform:translateZ(20px)}
  .bookObject:after{transform:translateZ(-20px)}
  .copyPane{padding:0 0 26px;justify-content:flex-start}
  .title{margin:18px 0 13px;font-size:clamp(42px,11.4vw,56px);line-height:.98}
  .lede{font-size:14.5px;line-height:1.55}
  .why{margin-top:18px;grid-template-columns:68px 1fr;gap:13px}
  .meta{margin-top:19px}
  .nav{grid-template-columns:1fr;overflow:hidden}
  .tabs{display:flex;overflow:auto;max-width:none}
  .tab{min-width:176px;min-height:70px;padding:0 18px;grid-template-columns:27px 1fr}
  .tab em{display:none}.controls{display:none}
}
@media(prefers-reduced-motion:reduce){.bookObject,.copyPane,.arrow{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">82TRADE</div>
    <div class="headerMeta"><span>CURATED READING</span><span>DONOR LOOP / STUDY 06</span></div>
  </header>
  <section class="stage">
    <div class="objectPane">
      <div class="bookFrame">
        <div class="bookObject" data-book>
          <div class="bookFront">
            <img data-book-image src="./assets/books/reminiscences.webp" alt="股票作手回憶錄封面">
          </div>
        </div>
      </div>
    </div>
    <article class="copyPane" data-copy>
      <div class="kicker" data-kicker>01 / 交易必備</div>
      <h1 class="title" data-title>股票作手回憶錄</h1>
      <p class="lede" data-lede>不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。</p>
      <div class="why"><span>Why read</span><p data-why>先理解人，再理解市場。讀完它，你不一定會立刻交易得更好，但會更早認出自己什麼時候正在犯錯。</p></div>
      <div class="meta" data-meta>Edwin Lefèvre · 1923 / 最終推薦版本待 Owner 書單確認</div>
    </article>
  </section>
  <nav class="nav" aria-label="Reading categories">
    <div class="tabs">
      <button class="tab" type="button" data-tab="0" data-active="true"><small>01</small><span class="tabCopy"><b>交易必備</b><em>股票作手回憶錄</em></span></button>
      <button class="tab" type="button" data-tab="1" data-active="false"><small>02</small><span class="tabCopy"><b>市場結構</b><em>新威科夫操盤法</em></span></button>
      <button class="tab" type="button" data-tab="2" data-active="false"><small>03</small><span class="tabCopy"><b>思維成長</b><em>納瓦爾寶典</em></span></button>
    </div>
    <div class="controls">
      <button class="arrow" type="button" data-dir="-1" aria-label="上一冊">←</button>
      <button class="arrow" type="button" data-dir="1" aria-label="下一冊">→</button>
    </div>
  </nav>
</div>
<script>
const books=[
  {category:"交易必備",title:"股票作手回憶錄",image:"./assets/books/reminiscences.webp",lede:"不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。",why:"先理解人，再理解市場。讀完它，你不一定會立刻交易得更好，但會更早認出自己什麼時候正在犯錯。",meta:"Edwin Lefèvre · 1923 / 最終推薦版本待 Owner 書單確認"},
  {category:"市場結構",title:"新威科夫操盤法",image:"./assets/books/wyckoff.webp",lede:"把市場重新還原成供需與參與者行為，而不是一堆互不相干的技術指標。",why:"當你已經會看圖，下一步不是再背一個形態，而是建立一套能解釋市場結構的語言。",meta:"Wyckoff reading line / 最終推薦版本待 Owner 書單確認"},
  {category:"思維成長",title:"納瓦爾寶典",image:"./assets/books/naval.webp",lede:"把視角從單次輸贏拉回長期複利：判斷、選擇、專注與自由。它不是交易書，但很適合交易者。",why:"交易之外，你仍然需要一套關於時間、決策與長期主義的底層坐標。",meta:"Eric Jorgenson / Naval Ravikant · 最終推薦版本待 Owner 書單確認"}
];
books.forEach(({image})=>{const i=new Image();i.src=image});
let index=0,locked=false;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const book=$("[data-book]"),copy=$("[data-copy]");
function render(i){
  const x=books[i];
  $("[data-book-image]").src=x.image;$("[data-book-image]").alt=x.title+"封面";
  $("[data-kicker]").textContent="0"+(i+1)+" / "+x.category;$("[data-title]").textContent=x.title;
  $("[data-lede]").textContent=x.lede;$("[data-why]").textContent=x.why;$("[data-meta]").textContent=x.meta;
  $$("[data-tab]").forEach((b,n)=>b.dataset.active=String(n===i));
}
function go(next){
  if(locked)return;
  locked=true;next=(next+books.length)%books.length;
  book.classList.remove("is-entering");copy.classList.remove("is-entering");
  book.classList.add("is-leaving");copy.classList.add("is-leaving");
  setTimeout(()=>{
    index=next;render(index);
    book.classList.remove("is-leaving");copy.classList.remove("is-leaving");
    void book.offsetWidth;
    book.classList.add("is-entering");copy.classList.add("is-entering");
    setTimeout(()=>{book.classList.remove("is-entering");copy.classList.remove("is-entering");locked=false},840);
  },290);
}
$$("[data-tab]").forEach((b,i)=>b.addEventListener("click",()=>go(i)));
$$("[data-dir]").forEach(b=>b.addEventListener("click",()=>go(index+(Number(b.dataset.dir)||1))));
</script>
</body>
</html>
