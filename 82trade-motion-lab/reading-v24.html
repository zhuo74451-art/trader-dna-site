<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>82TRADE — Reading Study 24</title>
<style>
/*
  3D book construction adapts mature donor mechanics from:
  - codrops/BookPreview (MIT code comments / 3D cover + inner surfaces)
  - scastiel/book-cover-3d (MIT / perspective book object)
  Art direction keeps the accepted V15 82TRADE editorial composition.
*/
:root{
  --bg:#171314;
  --accent:73,92,39;
  --ink:#f3f1ed;
  --soft:#aaa7a3;
  --muted:#666a72;
  --line:rgba(255,255,255,.09);
  --blue:#6ea0ff;
  --paper:#eee9dc;
  --back:#182014;
  --sans:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU",Iowan Old Style,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.72,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
.page{min-height:100svh;padding:0 3.4vw 16px;display:grid;grid-template-rows:58px minmax(700px,1fr) 68px;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055)}
.logo{font-size:14px;font-weight:850;letter-spacing:-.04em}
.headerMeta{color:#4e4a4a;font-size:7px;font-weight:680;letter-spacing:.17em;text-transform:uppercase}

.stage{position:relative;display:grid;grid-template-columns:minmax(560px,1.04fr) minmax(0,.96fr);min-height:700px}
.stage:after{
  content:"";position:absolute;left:-3.4vw;right:-3.4vw;bottom:0;height:24%;
  background:linear-gradient(180deg,rgba(255,255,255,.003),rgba(var(--accent),.025) 36%,rgba(255,255,255,.025));
  clip-path:polygon(5% 24%,95% 24%,100% 100%,0 100%);pointer-events:none
}
.visual{position:relative;z-index:2;display:grid;place-items:center;min-width:0;perspective:1800px}
.visual:before{
  content:"";position:absolute;width:72%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--accent),.34),rgba(var(--accent),.095) 40%,rgba(255,255,255,.012) 60%,transparent 77%);
  filter:blur(16px);transform:translate(1%,-2%)
}
.visual:after{
  content:"";position:absolute;width:62%;height:76px;bottom:8%;
  background:radial-gradient(ellipse,rgba(0,0,0,.76),rgba(var(--accent),.11) 30%,rgba(0,0,0,.16) 58%,transparent 80%);
  filter:blur(11px)
}
.bookRig{
  position:relative;z-index:3;width:min(30vw,430px);aspect-ratio:.68;
  perspective:1800px;transform:translate(-.2vw,18px);will-change:transform,opacity,filter
}
.book3d{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateY(-12deg) rotateX(.8deg);
  transform-origin:18% 52%;
  filter:drop-shadow(-28px 38px 34px rgba(0,0,0,.42)) drop-shadow(0 64px 74px rgba(0,0,0,.2));
  will-change:transform,opacity,filter
}
.front,.back,.pages{position:absolute;backface-visibility:hidden}
.front{
  inset:0;transform:translateZ(18px);overflow:hidden;
  border:1px solid rgba(255,255,255,.04);box-shadow:inset -1px 0 rgba(255,255,255,.09),0 1px rgba(255,255,255,.04)
}
.front img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(1.03) contrast(1.025)}
.front:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.24),transparent 9%,transparent 86%,rgba(255,255,255,.055))
}
.back{inset:0;transform:translateZ(-18px) rotateY(180deg);background:var(--back)}
.pages{
  top:5px;right:-18px;width:36px;height:calc(100% - 10px);
  transform:rotateY(90deg);transform-origin:left center;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0,rgba(255,255,255,.9) 2px,rgba(190,184,170,.6) 3px,rgba(248,244,234,.94) 5px),
    var(--paper);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)
}
.spine{
  position:absolute;top:0;bottom:0;left:-18px;width:36px;
  transform:rotateY(-90deg);transform-origin:right center;
  background:linear-gradient(90deg,#12160f,#26301c 48%,#11150f);
  box-shadow:inset 0 0 14px rgba(0,0,0,.22)
}
.bookRig.out .book3d{animation:bookTurnOut .34s cubic-bezier(.55,.05,.7,.35) both}
.bookRig.in .book3d{animation:bookTurnIn .62s var(--ease) both}
@keyframes bookTurnOut{
  to{opacity:0;transform:translateX(-48px) translateY(6px) rotateY(-84deg) rotateX(1deg) scale(.94);filter:blur(1.5px)}
}
@keyframes bookTurnIn{
  from{opacity:0;transform:translateX(52px) translateY(9px) rotateY(64deg) rotateX(1deg) scale(.95);filter:blur(1.5px)}
  to{opacity:1;transform:rotateY(-12deg) rotateX(.8deg);filter:none}
}
.bookRig:hover .book3d{transform:rotateY(-5deg) rotateX(.35deg) translateY(-4px)}

.copy{
  position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;
  padding:6vh 3vw 11vh 1vw;min-width:0;transition:opacity .22s ease,transform .3s ease
}
.copy.out{opacity:0;transform:translateY(9px)}
.copy.in{animation:copyIn .38s ease both}
@keyframes copyIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:8px;font-weight:760;letter-spacing:.18em;text-transform:uppercase}
.kicker:before{content:"";width:30px;height:1px;background:var(--blue)}
.title{
  margin:24px 0 16px;max-width:650px;font-family:var(--serif);font-size:clamp(50px,4.35vw,68px);
  line-height:.95;font-weight:430;letter-spacing:-.045em
}
.lede{max-width:560px;margin:0;color:var(--soft);font-family:var(--serif);font-size:15.5px;line-height:1.68}
.readingList{
  max-width:540px;margin-top:19px;border-top:1px solid rgba(255,255,255,.07)
}
.readingRow{
  min-height:42px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;
  gap:12px;border-bottom:1px solid var(--line);color:#5f6269
}
.readingRow small{font-size:8px;letter-spacing:.12em}
.readingRow b{font-size:11.5px;font-weight:520;letter-spacing:-.01em}
.readingRow em{font-style:normal;color:transparent;font-size:7px;font-weight:700;letter-spacing:.12em}
.readingRow[data-featured="true"]{color:#f2f0eb}
.readingRow[data-featured="true"] small{color:var(--blue)}
.readingRow[data-featured="true"] em{color:var(--blue)}

.nav{
  position:relative;z-index:6;border-top:1px solid var(--line);
  display:grid;grid-template-columns:70px 1fr 70px;align-items:center
}
.navEdge{
  height:68px;border:0;background:transparent;color:#555960;cursor:pointer;
  display:flex;align-items:center;gap:12px;font-size:8px;font-weight:680;letter-spacing:.14em;text-transform:uppercase;
  transition:color .18s ease
}
.navEdge{justify-content:center}\n.navEdge span{display:none}\n.navEdge:last-child{justify-content:center}
.navEdge:hover{color:#f3f1ed}
.navEdge i{font-style:normal;font-size:15px;line-height:1}
.tabs{display:flex;justify-content:center;align-items:center;gap:32px}
.tab{
  position:relative;height:68px;padding:0;border:0;background:transparent;color:#50545b;cursor:pointer;
  display:flex;align-items:center;gap:10px;text-align:left
}
.tab small{font-size:8px;letter-spacing:.12em}.tab b{font-size:10px;font-weight:560}
.tab:after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:transparent;
  transform:scaleX(.2);transition:transform .22s ease,background-color .22s ease
}
.tab[data-active="true"]{color:#f4f2ed}
.tab[data-active="true"] small{color:var(--blue)}
.tab[data-active="true"]:after{background:var(--blue);transform:scaleX(1)}

@media(max-width:900px){
  .page{padding:0 18px 14px;grid-template-rows:60px auto 68px;overflow:visible}
  .stage{grid-template-columns:1fr;min-height:0}
  .visual{min-height:430px;padding-top:10px}
  .visual:before{width:74%}
  .visual:after{width:68%;bottom:7%}
  .bookRig{width:min(71vw,286px);transform:translateY(8px)}
  .copy{padding:4px 0 28px;justify-content:flex-start}
  .title{margin:19px 0 14px;font-size:clamp(40px,10.9vw,54px);line-height:.98}
  .lede{font-size:14.5px;line-height:1.62}
  .readingList{margin-top:22px}
  .readingRow{min-height:44px;grid-template-columns:28px minmax(0,1fr) auto}
  .readingRow b{font-size:11px}
  .nav{grid-template-columns:1fr;overflow:hidden}
  .navEdge{display:none}
  .tabs{justify-content:flex-start;gap:30px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{min-width:max-content;height:60px;gap:8px}
  @keyframes bookTurnOut{to{opacity:0;transform:translateX(-36px) translateY(6px) rotateY(-68deg) scale(.96);filter:blur(1.2px)}}
  @keyframes bookTurnIn{from{opacity:0;transform:translateX(36px) translateY(8px) rotateY(52deg) scale(.96);filter:blur(1.2px)}to{opacity:1;transform:rotateY(-12deg);filter:none}}
}
@media(prefers-reduced-motion:reduce){
  .bookRig .book3d,.copy,.navEdge{animation:none!important;transition:none!important}
  .book3d,.bookRig:hover .book3d{transform:rotateY(-10deg)!important}
}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">82TRADE</div>
    <div class="headerMeta" data-header-meta>Reading List · 01 / 03</div>
  </header>

  <section class="stage">
    <div class="visual">
      <div class="bookRig" data-book>
        <div class="book3d">
          <div class="back"></div>
          <div class="spine"></div>
          <div class="pages"></div>
          <div class="front"><img data-image src="./assets/books/reminiscences-real.webp" alt="股票作手回憶錄"></div>
        </div>
      </div>
    </div>

    <article class="copy" data-copy>
      <div class="kicker" data-kicker>01 / 交易必備</div>
      <h1 class="title" data-title>股票作手回憶錄</h1>
      <p class="lede" data-lede>不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。</p>
      <div class="readingList" data-list>
        <div class="readingRow"><small>01</small><b>亞當理論</b><em></em></div>
        <div class="readingRow" data-featured="true"><small>02</small><b>股票作手回憶錄</b><em>SELECTED</em></div>
        <div class="readingRow"><small>03</small><b>交易聖經</b><em></em></div>
        <div class="readingRow"><small>04</small><b>量價分析</b><em></em></div>
      </div>
    </article>
  </section>

  <nav class="nav" aria-label="Reading categories">
    <button class="navEdge" type="button" data-dir="-1" aria-label="上一冊"><i>←</i><span>Previous</span></button>
    <div class="tabs">
      <button class="tab" type="button" data-tab="0" data-active="true"><small>01</small><b>交易必備</b></button>
      <button class="tab" type="button" data-tab="1" data-active="false"><small>02</small><b>技術分析</b></button>
      <button class="tab" type="button" data-tab="2" data-active="false"><small>03</small><b>思維成長</b></button>
    </div>
    <button class="navEdge" type="button" data-dir="1" aria-label="下一冊"><span>Next</span><i>→</i></button>
  </nav>
</div>
<script>
const books=[
  {
    category:"交易必備",title:"股票作手回憶錄",image:"./assets/books/reminiscences-real.webp",edge:"#26301c",back:"#172014",glow:"73,92,39",
    lede:"不是教你背一套招式，而是讓你看見交易者如何在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。",
    note:"先理解人，再理解市場。這一組從交易心理開始，不從指標開始。",
    list:["亞當理論","股票作手回憶錄","交易聖經","量價分析"]
  },
  {
    category:"技術分析",title:"技術分析聖經",image:"./assets/books/technical-analysis-real.webp",edge:"#2a2624",back:"#171514",glow:"187,149,52",
    lede:"把圖表、趨勢與市場行為放回一個完整框架。不是為了背更多形態，而是讓你的判斷有一套共同語言。",
    note:"從零散技巧進入系統閱讀：先建立共同語言，再談自己的方法。",
    list:["技術分析聖經","新威科夫操盤法","道氏理論"]
  },
  {
    category:"思維成長",title:"納瓦爾寶典",image:"./assets/books/naval.webp",edge:"#23262b",back:"#13161a",glow:"21,74,118",
    lede:"把視角從單次輸贏拉回長期複利：判斷、選擇、專注與自由。它不是交易書，但很適合交易者。",
    note:"交易之外，仍然需要一套關於時間、選擇與長期主義的底層坐標。",
    list:["先別急著吃棉花糖","灰階思考","原子習慣","納瓦爾寶典"]
  }
];
books.forEach(({image})=>{const i=new Image();i.src=image});
let index=0,locked=false;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const rig=$("[data-book]"),copy=$("[data-copy]");
function render(i){
  const x=books[i];
  $("[data-image]").src=x.image;$("[data-image]").alt=x.title;
  document.documentElement.style.setProperty("--back",x.back);
  document.documentElement.style.setProperty("--accent",x.glow);
  document.querySelector(".spine").style.background=`linear-gradient(90deg,${x.edge},color-mix(in srgb,${x.edge} 72%,white),${x.edge})`;
  $("[data-kicker]").textContent="0"+(i+1)+" / "+x.category;
  $("[data-title]").textContent=x.title;$("[data-lede]").textContent=x.lede;
  const list=$("[data-list]");
  list.replaceChildren(...x.list.map((name,n)=>{
    const row=document.createElement("div");
    row.className="readingRow";
    if(name===x.title)row.dataset.featured="true";
    row.innerHTML="<small>0"+(n+1)+"</small><b></b><em></em>";
    row.querySelector("b").textContent=name;
    if(name===x.title)row.querySelector("em").textContent="SELECTED";
    return row;
  }));
  $("[data-header-meta]").textContent="Reading List · 0"+(i+1)+" / 03";
  $$("[data-tab]").forEach((b,n)=>b.dataset.active=String(n===i));
}
function go(next){
  if(locked||next===index)return;locked=true;next=(next+books.length)%books.length;
  rig.classList.remove("in");copy.classList.remove("in");rig.classList.add("out");copy.classList.add("out");
  setTimeout(()=>{
    index=next;render(index);rig.classList.remove("out");copy.classList.remove("out");void rig.offsetWidth;
    rig.classList.add("in");copy.classList.add("in");
    setTimeout(()=>{rig.classList.remove("in");copy.classList.remove("in");locked=false},690);
  },340);
}
$$("[data-tab]").forEach((b,i)=>b.addEventListener("click",()=>go(i)));
$$("[data-dir]").forEach(b=>b.addEventListener("click",()=>go(index+(Number(b.dataset.dir)||1))));
</script>
</body>
</html>
