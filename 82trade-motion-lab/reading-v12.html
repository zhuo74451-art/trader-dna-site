<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>82TRADE — Reading Study 12</title>
<style>
/* 3D book thickness mechanics derived from scastiel/book-cover-3d (MIT). */
:root{
  --bg:#090a0c;--ink:#f3f1ed;--soft:#aaa9a6;--muted:#5f6268;--line:rgba(255,255,255,.09);
  --blue:#6ea0ff;--sans:"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Noto Serif CJK TC","Songti TC","PMingLiU",Iowan Old Style,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,.72,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
.page{min-height:100svh;padding:0 3.4vw 16px;display:grid;grid-template-rows:64px minmax(700px,1fr) 74px;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:14px;font-weight:850;letter-spacing:-.04em}
.headerMeta{color:#565a62;font-size:8px;font-weight:680;letter-spacing:.16em;text-transform:uppercase}
.stage{position:relative;display:grid;grid-template-columns:minmax(540px,1fr) minmax(0,1fr);min-height:700px}
.stage:after{
  content:"";position:absolute;left:-3.4vw;right:-3.4vw;bottom:0;height:20%;
  background:linear-gradient(180deg,rgba(255,255,255,.002),rgba(255,255,255,.018));
  clip-path:polygon(7% 30%,93% 30%,100% 100%,0 100%);pointer-events:none
}
.visual{position:relative;z-index:2;display:grid;place-items:center;min-width:0;perspective:1200px}
.visual:before{
  content:"";position:absolute;width:59%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.058),rgba(255,255,255,.014) 46%,transparent 72%);
  filter:blur(16px)
}
.visual:after{
  content:"";position:absolute;width:62%;height:72px;bottom:9%;
  background:radial-gradient(ellipse,rgba(0,0,0,.72),rgba(0,0,0,.14) 53%,transparent 77%);filter:blur(11px)
}
.bookScene{position:relative;z-index:3;width:min(36vw,520px);aspect-ratio:.67;display:grid;place-items:center;perspective:1200px;transform:translateX(-1vw)}
.bookObject{
  --depth:34px;position:relative;width:82%;height:90%;transform-style:preserve-3d;
  transform:rotateY(-17deg) rotateX(.65deg);transform-origin:50% 55%;
  transition:transform .48s var(--ease);will-change:transform,opacity,filter
}
.bookObject:hover{transform:rotateY(-7deg) rotateX(.15deg) translateY(-4px)}
.bookFace,.bookBack,.bookPages{position:absolute;inset:0}
.bookFace{
  transform:translateZ(calc(var(--depth)/2));overflow:hidden;background:#101114;
  box-shadow:0 18px 38px rgba(0,0,0,.38)
}
.bookFace img{display:block;width:100%;height:100%;object-fit:cover}
.bookFace:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 13%,transparent 88%,rgba(255,255,255,.05));pointer-events:none}
.bookBack{transform:translateZ(calc(var(--depth)/-2));background:#0c0d10}
.bookPages{
  inset:2px auto 2px 100%;width:var(--depth);transform-origin:left center;
  transform:translateZ(calc(var(--depth)/2)) rotateY(90deg);
  background:repeating-linear-gradient(90deg,#f0ede5 0,#f0ede5 2px,#d7d3ca 3px,#f7f4ed 5px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)
}
.bookObject.out{animation:bookOut .25s ease both}.bookObject.in{animation:bookIn .58s var(--ease) both}
@keyframes bookOut{to{opacity:0;transform:translateX(-64px) rotateY(-36deg) scale(.965);filter:blur(1.6px)}}
@keyframes bookIn{from{opacity:0;transform:translateX(64px) rotateY(-1deg) scale(.96);filter:blur(1.6px)}to{opacity:1;transform:rotateY(-17deg) rotateX(.65deg);filter:none}}

.copy{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:7vh 3vw 13vh 2vw;min-width:0;transition:opacity .18s ease,transform .26s ease}
.copy.out{opacity:0;transform:translateY(10px)}.copy.in{animation:copyIn .4s ease both}
@keyframes copyIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:13px;color:var(--blue);font-size:8px;font-weight:760;letter-spacing:.18em;text-transform:uppercase}
.kicker:before{content:"";width:28px;height:1px;background:var(--blue)}
.title{margin:30px 0 20px;max-width:720px;font-family:var(--serif);font-size:clamp(62px,5.2vw,84px);line-height:.94;font-weight:430;letter-spacing:-.047em}
.lede{max-width:620px;margin:0;color:var(--soft);font-family:var(--serif);font-size:17px;line-height:1.72}
.micro{margin-top:32px;color:#555a62;font-size:9px;letter-spacing:.1em;text-transform:uppercase}

.nav{position:relative;z-index:6;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:stretch}
.tabs{display:flex;align-items:stretch}
.tab{
  min-width:182px;height:74px;padding:0 24px 0 0;margin-right:28px;border:0;border-right:1px solid var(--line);
  background:transparent;display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;text-align:left;color:#5c6066;cursor:pointer
}
.tab small{font-size:8px;letter-spacing:.12em}.tab b{font-size:11px;font-weight:560}
.tab[data-active="true"]{color:#f4f2ed}.tab[data-active="true"] small{color:var(--blue)}
.controls{display:flex;align-items:center;gap:8px;padding-left:22px}
.arrow{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#62666e;cursor:pointer;transition:color .16s,border-color .16s,transform .16s}
.arrow:hover{color:#fff;border-color:rgba(255,255,255,.3);transform:translateY(-2px)}

@media(max-width:900px){
  .page{padding:0 18px 14px;grid-template-rows:60px auto 68px;overflow:visible}
  .stage{grid-template-columns:1fr;min-height:0}
  .visual{min-height:445px;padding-top:10px}
  .visual:before{width:75%}.visual:after{width:72%;bottom:7%}
  .bookScene{width:min(84vw,344px);transform:none}
  .bookObject{--depth:23px;width:82%;height:90%;transform:rotateY(-11deg)}
  .bookObject:hover{transform:rotateY(-11deg)}
  .copy{padding:0 0 31px;justify-content:flex-start}
  .title{margin:20px 0 14px;font-size:clamp(45px,12vw,60px);line-height:.97}
  .lede{font-size:14.5px;line-height:1.62}
  .micro{margin-top:22px;font-size:8px}
  .nav{grid-template-columns:1fr;overflow:hidden}
  .tabs{overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{min-width:150px;height:68px;margin-right:18px;padding-right:18px;grid-template-columns:28px 1fr}
  .controls{display:none}
  @keyframes bookOut{to{opacity:0;transform:translateX(-42px) scale(.97);filter:blur(1px)}}
  @keyframes bookIn{from{opacity:0;transform:translateX(42px) scale(.96);filter:blur(1px)}to{opacity:1;transform:rotateY(-11deg);filter:none}}
}
@media(prefers-reduced-motion:reduce){.bookObject,.copy,.arrow{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header class="header"><div class="logo">82TRADE</div><div class="headerMeta" data-header-meta>Reading List · 01 / 03</div></header>
<section class="stage">
  <div class="visual">
    <div class="bookScene">
      <div class="bookObject" data-book>
        <div class="bookBack"></div><div class="bookPages"></div>
        <div class="bookFace"><img data-image src="./assets/books/reminiscences-real.webp" alt="股票作手回憶錄"></div>
      </div>
    </div>
  </div>
  <article class="copy" data-copy>
    <div class="kicker" data-kicker>01 / 交易必備</div>
    <h1 class="title" data-title>股票作手回憶錄</h1>
    <p class="lede" data-lede>讓你看見交易者怎麼在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。</p>
    <div class="micro" data-micro>82TRADE SELECTED READING / 01</div>
  </article>
</section>
<nav class="nav" aria-label="Reading categories">
  <div class="tabs">
    <button class="tab" type="button" data-tab="0" data-active="true"><small>01</small><b>交易必備</b></button>
    <button class="tab" type="button" data-tab="1" data-active="false"><small>02</small><b>技術分析</b></button>
    <button class="tab" type="button" data-tab="2" data-active="false"><small>03</small><b>思維成長</b></button>
  </div>
  <div class="controls">
    <button class="arrow" type="button" data-dir="-1" aria-label="上一冊">←</button>
    <button class="arrow" type="button" data-dir="1" aria-label="下一冊">→</button>
  </div>
</nav>
</div>
<script>
const books=[
  {category:"交易必備",title:"股票作手回憶錄",image:"./assets/books/reminiscences-real.webp",lede:"讓你看見交易者怎麼在等待、貪婪、恐懼與自我欺騙之間，一次次做錯同樣的事。"},
  {category:"技術分析",title:"技術分析聖經",image:"./assets/books/technical-analysis-real.webp",lede:"把圖表、趨勢與市場行為放回完整框架。不是背更多形態，而是讓判斷開始有共同語言。"},
  {category:"思維成長",title:"納瓦爾寶典",image:"./assets/books/naval.webp",lede:"把視角從單次輸贏拉回長期複利：判斷、選擇、專注與自由。"}
];
books.forEach(({image})=>{const i=new Image();i.src=image});
let index=0,locked=false;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const book=$("[data-book]"),copy=$("[data-copy]");
function render(i){
  const x=books[i];$("[data-image]").src=x.image;$("[data-image]").alt=x.title;
  $("[data-kicker]").textContent="0"+(i+1)+" / "+x.category;$("[data-title]").textContent=x.title;$("[data-lede]").textContent=x.lede;
  $("[data-header-meta]").textContent="Reading List · 0"+(i+1)+" / 03";$("[data-micro]").textContent="82TRADE SELECTED READING / 0"+(i+1);
  $$("[data-tab]").forEach((b,n)=>b.dataset.active=String(n===i));
}
function go(next){
  if(locked)return;next=(next+books.length)%books.length;if(next===index)return;locked=true;
  book.classList.remove("in");copy.classList.remove("in");book.classList.add("out");copy.classList.add("out");
  setTimeout(()=>{index=next;render(index);book.classList.remove("out");copy.classList.remove("out");void book.offsetWidth;
    book.classList.add("in");copy.classList.add("in");setTimeout(()=>{book.classList.remove("in");copy.classList.remove("in");locked=false},620)},250);
}
$$("[data-tab]").forEach((b,i)=>b.addEventListener("click",()=>go(i)));
$$("[data-dir]").forEach(b=>b.addEventListener("click",()=>go(index+(Number(b.dataset.dir)||1))));
</script>
</body>
</html>
