name: Visual QA Freeze Snapshots

on:
  push:
    paths:
      - "82trade-brand-master/**"
      - ".github/scripts/visual-qa.mjs"
      - ".github/workflows/visual-qa.yml"

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install QA runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save puppeteer-core@24.24.0

      - name: Start local preview
        run: |
          python3 -m http.server 4173 > /tmp/82trade-http.log 2>&1 &
          echo $! > /tmp/82trade-http.pid
          sleep 2
          curl -f http://127.0.0.1:4173/82trade-brand-master/ > /dev/null

      - name: Locate browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium browser found on runner"
            exit 1
          fi
          echo "path=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Capture static, motion, mobile, and interaction states
        env:
          BROWSER: ${{ steps.browser.outputs.path }}
        run: node .github/scripts/visual-qa.mjs

      - name: Print diagnostics
        run: cat qa-snapshots/diagnostics.json

      - name: Upload QA snapshots
        uses: actions/upload-artifact@v4
        with:
          name: 82trade-visual-qa
          path: qa-snapshots/*
          if-no-files-found: error
          retention-days: 7
