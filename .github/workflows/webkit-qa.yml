name: WebKit QA

on:
  push:
    paths:
      - "82trade-brand-master/**"
      - ".github/scripts/webkit-qa.mjs"
      - ".github/workflows/webkit-qa.yml"

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Run WebKit QA
        run: node .github/scripts/webkit-qa.mjs
      - name: Upload WebKit receipts
        uses: actions/upload-artifact@v4
        with:
          name: 82trade-webkit-qa
          path: webkit-qa/**
          if-no-files-found: error
          retention-days: 7
